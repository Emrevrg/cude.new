<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Cude.new — build software with an AI engineering team</title>
  <desc id="desc">An animated monochrome Cude.new product banner with a live engineering pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".55" stop-color="#111"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#777"/><stop offset=".42" stop-color="#fff"/><stop offset=".7" stop-color="#aaa"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .pulse{animation:pulse 2.6s ease-in-out infinite}.scan{animation:scan 6s linear infinite}.dash{stroke-dasharray:9 12;animation:dash 8s linear infinite}.float{animation:float 5s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{from{transform:translateX(-520px) skewX(-18deg)}to{transform:translateX(1360px) skewX(-18deg)}}
      @keyframes dash{to{stroke-dashoffset:-168}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @media (prefers-reduced-motion:reduce){.pulse,.scan,.dash,.float{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="500" rx="26" fill="url(#bg)"/><rect width="1200" height="500" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="498" rx="25" fill="none" stroke="#fff" stroke-opacity=".14"/>
  <g class="float"><path d="M116 85l42 24v48l-42 24-42-24v-48z" fill="none" stroke="url(#metal)" stroke-width="8" stroke-linejoin="round"/><path d="M105 119l-15 14 15 14m22-28l15 14-15 14" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="186" y="143" fill="#fff" class="sans" font-size="58" font-weight="720" letter-spacing="-3">cude<tspan fill="#999" font-weight="320">.new</tspan></text>
  <text x="76" y="252" fill="#fff" class="sans" font-size="52" font-weight="680" letter-spacing="-2">Build software with an</text><text x="76" y="312" fill="#fff" class="sans" font-size="52" font-weight="680" letter-spacing="-2">AI engineering team.</text>
  <text x="78" y="352" fill="#aaa" class="sans" font-size="18">Plan · Architect · Design · Build · Test · Repair · Release</text>
  <g transform="translate(678 92)">
    <rect width="440" height="310" rx="18" fill="#0a0a0a" stroke="#fff" stroke-opacity=".16"/><circle cx="24" cy="23" r="4" fill="#666"/><circle cx="40" cy="23" r="4" fill="#444"/><circle cx="56" cy="23" r="4" fill="#333"/>
    <text x="78" y="28" fill="#a8a8a8" class="mono" font-size="11">CUDE ENGINEERING RUN</text><line x1="25" y1="53" x2="415" y2="53" stroke="#fff" stroke-opacity=".1"/><path class="dash" d="M43 82v179" stroke="#777" stroke-width="1.5"/>
    <g class="sans" font-size="14">
      <g transform="translate(29 76)"><circle cx="14" cy="10" r="8" fill="#fff"/><path d="m10 10 3 3 6-7" fill="none" stroke="#000" stroke-width="2"/><text x="40" y="15" fill="#eee">Requirements mapped</text><text x="365" y="15" fill="#777" font-size="11">DONE</text></g>
      <g transform="translate(29 122)"><circle cx="14" cy="10" r="8" fill="#fff"/><path d="m10 10 3 3 6-7" fill="none" stroke="#000" stroke-width="2"/><text x="40" y="15" fill="#eee">Architecture selected</text><text x="365" y="15" fill="#777" font-size="11">DONE</text></g>
      <g transform="translate(29 168)"><circle cx="14" cy="10" r="8" fill="#fff"/><path d="m10 10 3 3 6-7" fill="none" stroke="#000" stroke-width="2"/><text x="40" y="15" fill="#eee">Design system applied</text><text x="365" y="15" fill="#777" font-size="11">DONE</text></g>
      <g transform="translate(29 214)" class="pulse"><circle cx="14" cy="10" r="9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="14" cy="10" r="3" fill="#fff" filter="url(#glow)"/><text x="40" y="15" fill="#fff" font-weight="650">Building workspace</text><text x="350" y="15" fill="#fff" font-size="11">ACTIVE</text></g>
      <g transform="translate(29 260)"><circle cx="14" cy="10" r="8" fill="#222" stroke="#555"/><text x="40" y="15" fill="#777">Test and visual QA</text><text x="345" y="15" fill="#555" font-size="11">QUEUED</text></g>
    </g>
  </g>
  <rect class="scan" x="0" y="0" width="420" height="500" fill="url(#beam)" opacity=".12"/>
  <g class="mono" font-size="11" fill="#888"><text x="78" y="442">OPEN SOURCE · MULTI MODEL · MULTI TARGET</text><text x="984" y="442">v0.1.0</text></g>
</svg>
