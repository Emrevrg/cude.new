<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="t d">
  <title id="t">Cude.new engineering flow</title><desc id="d">An animated path from intent to verified release.</desc>
  <defs><linearGradient id="g"><stop stop-color="#111"/><stop offset=".5" stop-color="#aaa"/><stop offset="1" stop-color="#111"/></linearGradient><style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:ui-monospace,Consolas,monospace}.run{animation:r 5s linear infinite}@keyframes r{from{transform:translateX(0)}to{transform:translateX(860px)}}@media(prefers-reduced-motion:reduce){.run{animation:none}}</style></defs>
