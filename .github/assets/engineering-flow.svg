  <g class="s" font-size="13" fill="#111" text-anchor="middle"><text x="70" y="126">Intent</text><text x="242" y="126">Plan</text><text x="414" y="126">Design</text><text x="586" y="126">Build</text><text x="758" y="126">Test + Repair</text><text x="930" y="126">Verified</text></g>
